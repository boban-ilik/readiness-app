# Every function below verifies the caller's session itself (see
# supabase/functions/_shared/entitlement.ts and delete-account), so the
# gateway check is off. Deploy with --no-verify-jwt to match.

[functions.strava-token-exchange]
verify_jwt = false

[functions.weekly-report]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.daily-briefing]
verify_jwt = false

[functions.coach-chat]
verify_jwt = false

[functions.ai-insight]
verify_jwt = false
