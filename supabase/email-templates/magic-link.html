<!--
  Magic Link — paste into Supabase Dashboard:
  Authentication → Emails → Templates → Magic Link

  Suggested subject:  Your Readiness sign-in link

  The app's own flows use OTP codes, not magic links, so this template mostly
  exists so that anything that does send one (dashboard tests, future web
  login) looks branded rather than like the Supabase default.
-->
<html>
  <body style="margin:0; padding:0; background-color:#0D0F14;">
    <div style="display:none; max-height:0; overflow:hidden;">
      Your sign-in link for Readiness
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#0D0F14" style="background-color:#0D0F14;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="440" cellpadding="0" cellspacing="0" style="max-width:440px; width:100%;">

            <!-- Wordmark -->
            <tr>
              <td align="center" style="padding-bottom:28px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <span style="font-size:22px; font-weight:700; color:#F0F2F8; letter-spacing:0.5px;">Readiness</span>
                <span style="font-size:22px; font-weight:700; color:#F5A623;">.</span>
              </td>
            </tr>

            <!-- Card -->
            <tr>
              <td bgcolor="#1C2030" style="background-color:#1C2030; border-radius:16px; padding:36px 32px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="font-size:19px; font-weight:600; color:#F0F2F8; padding-bottom:12px;">
                      Sign in to Readiness
                    </td>
                  </tr>
                  <tr>
                    <td style="font-size:15px; line-height:23px; color:#9BA3B8; padding-bottom:28px;">
                      Tap the button below to sign in. This link works once and expires shortly.
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding-bottom:28px;">
                      <table role="presentation" cellpadding="0" cellspacing="0">
                        <tr>
                          <td bgcolor="#F5A623" style="background-color:#F5A623; border-radius:12px;">
                            <a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:14px 36px; font-size:16px; font-weight:700; color:#0D0F14; text-decoration:none;">Sign In</a>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td style="font-size:13px; line-height:20px; color:#5A6180;">
                      If you didn't request this, you can safely ignore this email.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td align="center" style="padding-top:24px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:18px; color:#5A6180;">
                Readiness · Your daily recovery score<br>
                <a href="https://thereadiness.app/privacy/" style="color:#5A6180; text-decoration:underline;">Privacy Policy</a>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
