name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Type-check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --ext .ts,.tsx

      - name: Test
        run: npx jest --ci

  edge-functions:
    name: Deno check (advisory)
    runs-on: ubuntu-latest
    # First pass: surface type errors without blocking merge. Tighten once clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Deno check edge functions
        run: deno check supabase/functions/*/index.ts
